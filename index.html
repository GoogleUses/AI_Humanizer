<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GoBattle.io item values and relic upgrade points."
    />
    <title>Gobattle.io Item Values</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <h1>Gobattle.io Item Values</h1>
      </header>

      <main>
        <section class="toolbar" aria-label="Filter item values">
          <label class="search-box">
            <span class="sr-only">Search items</span>
            <input
              id="search"
              type="search"
              placeholder="Search items..."
              autocomplete="off"
            />
            <button id="clear-search" class="clear-search" type="button" hidden>
              Clear
            </button>
          </label>
          <div id="category-filters" class="filter-list" aria-label="Item type"></div>
        </section>

        <div id="catalog" class="catalog"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">⌕</div>
          <h2>No items found</h2>
          <p>Try a different item name or clear the active filters.</p>
          <button id="reset-filters" class="button button-primary" type="button">
            Show all items
          </button>
        </div>
      </main>

    </div>
  </body>
</html>
